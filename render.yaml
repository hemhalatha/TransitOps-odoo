services:
  - type: web
    name: fleetflow
    runtime: node
    plan: free
    region: singapore
    branch: master
    autoDeploy: true
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: MONGO_CONNECT_RETRIES
        value: 20
      - key: MONGO_CONNECT_RETRY_DELAY_MS
        value: 2000
